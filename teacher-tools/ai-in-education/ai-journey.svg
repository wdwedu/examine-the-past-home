<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 310" role="img" aria-labelledby="journey-title journey-desc" id="aiJourney">
<title id="journey-title">AI in Education</title><desc id="journey-desc">Pulses of light travel through a circuit, gather into an open book, and reveal AI in Education. The finished book and title gently glow.</desc>
<defs><linearGradient id="ai-bg"><stop stop-color="#06172b"/><stop offset=".55" stop-color="#0d241a"/><stop offset="1" stop-color="#050a10"/></linearGradient><linearGradient id="ai-line"><stop stop-color="#629ffa"/><stop offset=".55" stop-color="#94ff53"/><stop offset="1" stop-color="#fff200"/></linearGradient><filter id="ai-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/></filter><path id="journey-path" d="M-30 220H90L150 160H270L330 100H435L495 155H590L655 155"/></defs>
<style>
.journey-route{stroke-dasharray:1100;stroke-dashoffset:1100;animation:route 16s ease-in-out infinite}.journey-arrival{animation:arrival 16s ease-in-out infinite}.journey-book{animation:book 16s ease-in-out infinite;transform-origin:650px 155px}.journey-stars{animation:stars 3s ease-in-out infinite alternate}.journey-end{animation:endglow 3s ease-in-out infinite alternate}.journey-chip{animation:chip 16s ease-in-out infinite}@keyframes route{0%{stroke-dashoffset:1100}35%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:1100}}@keyframes arrival{0%,33%{opacity:0;transform:translateX(28px)}45%,94%{opacity:1;transform:translateX(0)}100%{opacity:0}}@keyframes book{0%,25%{opacity:0;transform:scale(.5)}40%,94%{opacity:1;transform:scale(1)}100%{opacity:0}}@keyframes stars{from{opacity:.35}to{opacity:1}}@keyframes endglow{from{filter:drop-shadow(0 0 1px #94ff5333)}to{filter:drop-shadow(0 0 8px #94ff5380)}}@keyframes chip{0%,10%{opacity:.5}25%,90%{opacity:1}100%{opacity:.5}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.journey-route{stroke-dashoffset:0}.journey-travelers{display:none}}
</style>
<rect x="1" y="1" width="1398" height="308" rx="24" fill="url(#ai-bg)" stroke="#4b6746"/>
<g opacity=".22" stroke="#69af91" fill="none"><path d="M0 45H260L300 85H450M0 270H330L370 230H490M760 35H1150L1190 75H1400M810 270H1130L1170 230H1400"/><path d="M45 0V55L90 100V310M1350 0V115L1300 165V310"/></g>
<g fill="#94ff53" class="journey-stars"><circle cx="200" cy="60" r="3"/><circle cx="400" cy="255" r="3"/><circle cx="1160" cy="50" r="3"/><circle cx="1260" cy="260" r="3"/><circle cx="1040" cy="225" r="2"/></g>
<g fill="none" stroke="#588968" stroke-width="2" opacity=".45"><use href="#journey-path"/><path d="M10 95H150L210 155H300L360 215H495L555 155H650M0 155H75L130 105H280L330 155H650"/></g>
<g class="journey-chip" transform="translate(100 113)" fill="#091629" stroke="#91baff" stroke-width="3"><rect width="86" height="86" rx="17"/><path d="M20-12V0M43-12V0M66-12V0M20 86V98M43 86V98M66 86V98M-12 20H0M-12 43H0M-12 66H0M86 20H98M86 43H98M86 66H98"/><text x="43" y="55" text-anchor="middle" fill="#fff200" stroke="none" font-family="Georgia,serif" font-size="35">AI</text></g>
<use href="#journey-path" class="journey-route" fill="none" stroke="url(#ai-line)" stroke-width="4"/>
<g class="journey-travelers" fill="#fff200"><circle r="10" filter="url(#ai-glow)"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#journey-path"/></animateMotion></circle><circle r="5"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#journey-path"/></animateMotion></circle><circle r="4" fill="#94ff53"><animateMotion dur="6s" begin="1.5s" repeatCount="indefinite"><mpath href="#journey-path"/></animateMotion></circle></g>
<g class="journey-book" fill="#173322" stroke="#b0ff78" stroke-width="4" stroke-linejoin="round"><path d="M560 104Q608 90 650 117V220Q608 193 560 208ZM650 117Q692 90 740 104V208Q692 193 650 220Z"/><path d="M578 130Q610 122 632 137M578 151Q610 143 632 158M578 172Q610 164 632 179M668 137Q695 122 723 130M668 158Q695 143 723 151M668 179Q695 164 723 172" stroke-width="2"/><path d="M650 71V89M624 80L630 94M676 80L670 94" stroke="#fff200"/></g>
<g class="journey-arrival" font-family="Georgia,serif"><g class="journey-end"><text x="800" y="142" fill="#fff200" font-size="53" font-weight="bold">AI in Education</text><text x="803" y="184" fill="#cce8b8" font-size="23">Ideas travel. Learning takes shape.</text></g></g>
<text x="42" y="278" fill="#9fbd9a" font-family="Georgia,serif" font-size="17" letter-spacing="3">EXPLORE · CREATE · QUESTION · LEARN</text>
</svg>
