name: Master Integration Audit V61
on:
  push:
    paths:
      - scripts/master_integration_v61_request.txt
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/master_integration_audit_v61.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/master-integration-v61.json
          git commit -m "Audit master integration v61 [skip ci]" || true
          git push
