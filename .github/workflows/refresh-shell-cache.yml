name: Refresh shared shell cache
on:
  push:
    paths:
      - scripts/shell_cache_request.txt
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/bump_shell_cache.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '**/*.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh universal shell cache v42 [skip ci]"
          git push
