name: Unpack History Hub course banners
on:
  push:
    paths:
      - 'History_Hub_Images_Part_1_5_Images.zip'
      - 'History_Hub_Images_Part_2_5_Images.zip'
      - '.github/workflows/unpack-history-hub-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract course images
        run: |
          mkdir -p assets/history-hub
          unzip -j -o History_Hub_Images_Part_1_5_Images.zip '*.webp' -d assets/history-hub
          unzip -j -o History_Hub_Images_Part_2_5_Images.zip '*.webp' -d assets/history-hub
          test "$(find assets/history-hub -maxdepth 1 -type f -name '*.webp' | wc -l)" -ge 10
      - name: Commit course banner assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/history-hub/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Extract ten History Hub course banner images"
            git push
          fi
