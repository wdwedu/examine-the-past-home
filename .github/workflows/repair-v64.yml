name: Restore Examine the Past v64
on:
  push:
    paths:
      - scripts/repair-v64-request.txt
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_repair_v64.py
      - name: Commit verified repair and preserved assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Restore game vault, navigation, mobile sizing and reading controls v64"
          git push
