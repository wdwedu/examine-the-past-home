name: Install original Visual History intro from supplied ZIP
on:
  push:
    paths:
      - .github/workflows/extract-visual-history-intro.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract the original Visual History intro, not the 9/11 preview
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,shutil
          archive=Path("ETP_Visual_History_911_Web_Package_FIXED.zip")
          source="ETP_Visual_History_911_Web_Package/assets/visual-history-intro-720p.mp4"
          with zipfile.ZipFile(archive) as z:
              if source not in z.namelist():raise SystemExit("Expected original video is not in the ZIP")
              destination=Path("assets/visual-history/visual-history-intro.mp4")
              destination.parent.mkdir(parents=True,exist_ok=True)
              with z.open(source) as inp, destination.open("wb") as out:shutil.copyfileobj(inp,out)
          content=destination.read_bytes()
          if len(content)<100000 or b"ftyp" not in content[:48]:raise SystemExit("Extracted file does not look like an MP4")
          page=Path("lessons/visual-history/index.html")
          html=page.read_text(encoding="utf-8")
          old='const publishedIntro="";'
          new='const publishedIntro="../../assets/visual-history/visual-history-intro.mp4";'
          if old not in html and new not in html:raise SystemExit("Player placeholder not found")
          page.write_text(html.replace(old,new),encoding="utf-8")
          print("Installed supplied original intro:",source,"bytes:",len(content))
          PY
      - name: Commit and publish supplied video
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/visual-history/visual-history-intro.mp4 lessons/visual-history/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish supplied Visual History intro video [skip ci]"
          git push
