name: Hero Master Lessons Desktop and Mobile Browser QA
on:
  push:
    paths:
      - .github/workflows/hero-series-browser-qa.yml
  workflow_dispatch:
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test all five lessons on desktop and mobile
        run: |
          python3 -m http.server 8765 --directory . >/tmp/hero-site.log 2>&1 &
          sleep 3
          node scripts/check_hero_series_browser.mjs
