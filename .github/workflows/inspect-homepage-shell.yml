name: Inspect homepage shell
on:
  push:
    paths:
      - scripts/homepage_audit_request.txt
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/audit_homepage_shell.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/homepage-shell-audit.txt
          git commit -m "Generate homepage shell audit [skip ci]"
          git push
