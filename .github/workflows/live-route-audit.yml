name: Live Website Route Audit
on:
  push:
    paths:
      - .github/workflows/live-route-audit.yml
      - scripts/live_route_audit.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test deployed HTML routes and media
        run: python3 scripts/live_route_audit.py
      - name: Commit live website audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/live-route-audit.json audit/live-route-audit.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record live website route QA [skip ci]"
          git push
