name: Certification Center QA

on:
  push:
    paths:
      - "teacher-tools/certification-prep/**"
      - "scripts/check_certification_center.py"
      - "scripts/check_certification_browser.mjs"
      - "scripts/check_certification_chromium.mjs"
      - ".github/workflows/certification-center-qa.yml"
  workflow_dispatch:

jobs:
  validate-certification-center:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate all three 5941 exam banks and page links
        run: python scripts/check_certification_center.py
      - name: Install DOM smoke-test runtime
        run: npm install --no-save --no-package-lock jsdom@24
      - name: Simulate guided practice and both timed exams
        run: node scripts/check_certification_browser.mjs
      - name: Install Chromium browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test real desktop and mobile browser journeys and PDF output
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/etp-cert-http.log 2>&1 &
          sleep 2
          node scripts/check_certification_chromium.mjs
      - name: Preserve release screenshots and generated PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certification-center-release-audit
          path: audit/certification-browser/
          if-no-files-found: ignore
