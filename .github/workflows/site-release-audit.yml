name: Full Site Release Audit
on:
  push:
    paths:
      - .github/workflows/site-release-audit.yml
      - scripts/site_release_audit.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all HTML pages, internal links and asset references
        run: python3 scripts/site_release_audit.py
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/site-release-audit.md audit/site-release-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record full site release QA report [skip ci]"
          git push
