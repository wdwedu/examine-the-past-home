name: Inspect Time Rush Stale Shell V61
on:
  push:
    paths:
      - scripts/time_rush_stale_shell_v61_request.txt
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/inspect_time_rush_stale_shell_v61.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/time-rush-stale-shell-context-v61.json
          git commit -m "Inspect Time Rush stale shell context [skip ci]" || true
          git push
