name: Apply Master Integration V61
on:
  push:
    paths:
      - scripts/master_integration_apply_v61_request.txt
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/apply_master_integration_v61.py
      - name: Validate master integration report
        run: |
          python - <<'PY'
          import json
          r=json.load(open("audit/master-integration-v61-final.json",encoding="utf-8"))
          assert not r["missing_shell"], r["missing_shell"]
          assert not r["stale_shell_versions"], r["stale_shell_versions"]
          assert not r["placeholder_hrefs"], r["placeholder_hrefs"]
          assert not r["legacy_absolute_preview_urls"], r["legacy_absolute_preview_urls"]
          print("Master integration validation passed.")
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply final universal shell and integration cleanup v61 [skip ci]"
          git push
