name: Homepage Navigation Emergency Fix
on:
  push:
    paths:
      - scripts/homepage_nav_fix_request.txt
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/fix_homepage_nav_v48.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html lessons teacher-tools timeline maps today shop faq licensing careers current-events copyright refund
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix homepage navigation across desktop and mobile [skip ci]"
          git push
