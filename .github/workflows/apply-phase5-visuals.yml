name: Apply Phase 5 lesson visuals
on:
  push:
    paths:
      - scripts/phase5_visuals_request.txt
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/apply_phase5_visuals.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/phase3-mini-labs-data.js lessons
          if git diff --cached --quiet; then
            echo "No Phase 5 visual changes"
            exit 0
          fi
          git commit -m "Apply Phase 5 lesson visual rollout [skip ci]"
          git push
