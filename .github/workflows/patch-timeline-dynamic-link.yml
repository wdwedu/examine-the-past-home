name: Patch Timeline Dynamic Source Link
on:
  push:
    paths:
      - scripts/timeline_dynamic_link_patch_request.txt
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/patch_timeline_dynamic_link.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timeline/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Timeline dynamic source-link fallback [skip ci]"
          git push
