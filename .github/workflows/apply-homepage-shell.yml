name: Apply homepage shell and appetizers
on:
  push:
    paths:
      - scripts/homepage_patch_request.txt
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/patch_homepage_shell.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html '**/*.html'
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Integrate universal shell and homepage appetizers [skip ci]"
          git push
