name: Build 28 Home Navigation Patch
on:
  push:
    branches: [main]
    paths: [".github/workflows/build28-home-nav.yml"]
permissions:
  contents: write
jobs:
  patch-home-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch home navigation
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html"); s=p.read_text(encoding="utf-8")
          start='<style id="build28-home-nav">'; end='</style>'
          patch='''<style id="build28-home-nav">
          .site-nav.final-nav.etp-nav-vnext{position:fixed!important;top:0!important;left:0!important;right:0!important;width:100%!important;z-index:9999!important;background:#000!important;border-bottom:1px solid #242424!important;box-shadow:none!important}
          body#top{padding-top:82px!important}
          @media(max-width:760px){body#top{padding-top:72px!important}.site-nav.final-nav.etp-nav-vnext{background:#000!important}}
          </style>'''
          if start in s:
              a=s.index(start); b=s.index(end,a)+len(end); s=s[:a]+patch+s[b:]
          else:
              s=s.replace("</head>",patch+"</head>",1)
          p.write_text(s,encoding="utf-8")
      - name: Commit patch
        run: |
          git config user.name "WDWEDU Build Bot"
          git config user.email "wdwedu@gmail.com"
          git add index.html
          if ! git diff --cached --quiet; then git commit -m "Build 28: keep home icon navigation fixed and jet black"; git push; fi
