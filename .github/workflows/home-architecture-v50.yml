name: Homepage Architecture V50
on:
  push:
    paths:
      - scripts/home_architecture_v50_request.txt
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/apply_home_architecture_v50.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html lessons teacher-tools timeline maps today shop faq licensing careers current-events copyright refund assets games
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build consolidated History Hub Teacher Tools and universal shell v50 [skip ci]"
          git push
