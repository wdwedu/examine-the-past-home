name: Unpack Teacher Tools image previews
on:
  push:
    paths:
      - 'Teacher_Tools_Images_UPLOAD.zip'
      - '.github/workflows/unpack-teacher-tools.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract optimized image previews
        run: |
          mkdir -p assets/teacher-tools
          unzip -j -o Teacher_Tools_Images_UPLOAD.zip '*.webp' -d assets/teacher-tools
          test "$(find assets/teacher-tools -maxdepth 1 -name '*.webp' | wc -l)" -eq 8
      - name: Commit extracted images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/teacher-tools/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Extract eight Teacher Tools preview images"
            git push
          fi
