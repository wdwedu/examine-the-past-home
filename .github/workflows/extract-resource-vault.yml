name: Extract resource vault styling
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-resource-vault.yml"
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install beautifulsoup4
      - run: python .github/scripts/extract_resource_vault.py
      - run: |
          git config user.name "Examine the Past Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/resource-vault-snapshot.txt
          if git diff --cached --quiet; then echo "No changes."; else git commit -m "Dev: snapshot resource vault styling" && git push; fi
