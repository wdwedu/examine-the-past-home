name: Final Stabilization Build
on:
  push:
    paths:
      - scripts/final_stabilization_request.txt
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/final_stabilization.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets lessons maps today shop teacher-tools games/map-quest current-events faq licensing careers
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Complete final stabilization build [skip ci]"
          git push
