name: Build 1 navigation patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build1-nav.yml"

permissions:
  contents: write

jobs:
  patch-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Patch Games navigation
        run: python .github/scripts/patch_build1.py
      - name: Commit navigation update
        run: |
          git config user.name "Examine the Past Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Build 1: add Games navigation and Games star"
            git push
          fi
