name: Finish semantic heading review
on:
  push:
    paths:
      - .github/workflows/finish-heading-cleanup.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  headings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Improve game screen reader headings
        run: python3 scripts/finish_heading_audit.py
      - name: Re-run comprehensive site QA
        run: python3 scripts/site_release_audit.py
      - name: Commit fixed pages and audit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/time-rush games/presidential-challenge/index.html audit/site-release-audit.md audit/site-release-audit.json audit/game-h1-fixes.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Improve accessible game H1s and validate dynamic lesson headings [skip ci]"
          git push
