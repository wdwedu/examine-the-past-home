name: Inspect Master Integration V61 Failure
on:
  push:
    paths:
      - scripts/master_integration_inspect_v61_request.txt
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/apply_master_integration_v61.py
      - run: cat audit/master-integration-v61-final.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/master-integration-v61-final.json
          git commit -m "Record master integration validation details [skip ci]" || true
          git push
