name: Integrate Classroom Management V57
on:
  push:
    paths:
      - scripts/classroom_management_v57_request.txt
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Import existing Classroom Management application
        run: |
          mkdir -p teacher-tools/classroom-management
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/wdwedu/classroom-management/main/index.html \
            -o teacher-tools/classroom-management/index.html
      - name: Apply universal Examine the Past shell
        run: python scripts/integrate_classroom_management_v57.py
      - name: Validate imported application
        run: |
          test -s teacher-tools/classroom-management/index.html
          grep -q "site-shell.js?v=57" teacher-tools/classroom-management/index.html
          python - <<'PY'
          from pathlib import Path
          p=Path("teacher-tools/classroom-management/index.html")
          print("classroom-management bytes:",p.stat().st_size)
          assert p.stat().st_size > 7000000, "Classroom Management import unexpectedly small"
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teacher-tools/classroom-management/index.html audit/classroom-management-v57.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Integrate Classroom Management into universal shell v57 [skip ci]"
          git push
