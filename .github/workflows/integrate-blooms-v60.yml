name: Integrate Blooms Taxonomy V60
on:
  push:
    paths:
      - scripts/blooms_v60_request.txt
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: |
          mkdir -p teacher-tools/blooms-taxonomy
          curl -L --fail --retry 3 https://raw.githubusercontent.com/wdwedu/blooms-taxonomy/main/index.html -o teacher-tools/blooms-taxonomy/index.html
      - run: python scripts/integrate_blooms_v60.py
      - run: |
          test -s teacher-tools/blooms-taxonomy/index.html
          grep -q "site-shell.js?v=60" teacher-tools/blooms-taxonomy/index.html
          python - <<'PY'
          from pathlib import Path
          p=Path("teacher-tools/blooms-taxonomy/index.html")
          assert p.stat().st_size > 2000000
          print("blooms bytes:",p.stat().st_size)
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teacher-tools/blooms-taxonomy/index.html audit/blooms-v60.md
          git commit -m "Integrate Bloom's Taxonomy into universal shell v60 [skip ci]" || true
          git push
