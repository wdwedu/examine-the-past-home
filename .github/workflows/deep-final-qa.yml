name: Deep Final QA
on:
  push:
    paths:
      - scripts/final_qa_request.txt
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/final_site_qa.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/final-qa-report.json audit/final-qa-report.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Run deep final structural QA [skip ci]"
          git push
