name: Optimize legacy lesson images
on:
  push:
    paths:
      - 'assets/legacy-images-inbox/**'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pillow
      - run: python scripts/optimize_legacy_images.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/legacy-images
          if git diff --cached --quiet; then
            echo "No optimized image changes"
            exit 0
          fi
          git commit -m "Optimize legacy lesson images [skip ci]"
          git push
