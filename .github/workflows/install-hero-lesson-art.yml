name: Install approved African Legends hero artwork
on:
  push:
    paths:
      - .github/workflows/install-hero-lesson-art.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract optimized five-image package
        run: |
          python3 - <<'PY'
          import zipfile,pathlib
          source=pathlib.Path("ETP_Hero_Images_Web_Ready.zip")
          expected={"makeda.webp","shabaka.webp","sundiata.webp","taharqa.webp","piye.webp"}
          dest=pathlib.Path("assets/hero-lessons")
          dest.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(source) as z:
            found=set(z.namelist())
            assert expected <= found,(expected-found)
            for name in sorted(expected):
              data=z.read(name)
              assert data[:4]==b'RIFF' and data[8:12]==b'WEBP',name
              assert len(data)<750000,(name,len(data))
              (dest/name).write_bytes(data)
              print(name,len(data))
          PY
      - name: Publish optimized artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero-lessons/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Install five approved African Legends hero illustrations [skip ci]"
          git pull --rebase origin main
          git push
