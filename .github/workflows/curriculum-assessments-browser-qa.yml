name: Grades 9–12 Assessment Browser QA
on:
  pull_request:
    paths:
      - "assets/*assessment*"
      - "assets/*grade5*data.json"
      - "lessons/curriculum/grade-*/**/index.html"
      - "scripts/check_curriculum_assessments_browser.mjs"
      - ".github/workflows/curriculum-assessments-browser-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the Playwright test runner
        run: npm install --no-save playwright@1.56.1
      - name: Test assessment routes in desktop and mobile Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/curriculum-site.log 2>&1 &
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/check_curriculum_assessments_browser.mjs
