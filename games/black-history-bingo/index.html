<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Match portrait clues in Black History Heroes Bingo."><title>Black History Heroes Bingo | Examine the Past</title><link rel="stylesheet" href="../../assets/black-history-games.css?v=20261108-bingo-colors-v4"></head><body><main class="bhg-wrap"><a class="bhg-back" href="../black-history/">← Black History Games</a><h1>Black History Heroes Bingo</h1><p class="bhg-desc">Read the clue. Tap its matching portrait. Get five in a row to call BINGO! Shuffle for a whole new card.</p><div class="bhg-stats"><span id="score">0 of 24 found</span><button class="bhg-action" type="button" id="restart">Shuffle a New Card</button></div><div class="bhg-clue" id="clue" aria-live="polite"><strong>HISTORICAL CLUE</strong>Loading the Hall of Legends…</div><div id="status" class="bhg-status" role="status" aria-live="polite"></div><div id="board" class="bhg-bingo-board" aria-label="Five by five Black History picture Bingo board"></div></main>
<script>
(()=>{"use strict";const $=id=>document.getElementById(id),people=[],profiles=new Map();let card=[],marked=new Set(),pool=[],current=null,won=false,advancing=false;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const clueText=p=>{let s=p.overview;const person=people.find(x=>x.id===p.id),name=person?.name||"";if(name)s=s.replace(name,"This historical figure");const surname=name.split(" ").at(-1);if(surname&&surname.length>3)s=s.replaceAll(surname,"the figure");return "Which historical figure fits this account? "+s;};
function next(){const remaining=pool.filter(id=>!marked.has(id));if(!remaining.length){current=null;$("clue").textContent="All 24 portraits identified. Create a new card to play again!";return;}
current=remaining[Math.floor(Math.random()*remaining.length)];$("clue").replaceChildren();const label=document.createElement("strong");label.textContent="WHO AM I?";$("clue").append(label,document.createTextNode(clueText(profiles.get(current))));}
function lines(){let b=card.map(x=>x===null||marked.has(x));let lists=[];for(let n=0;n<5;n++){lists.push([0,1,2,3,4].map(c=>n*5+c));lists.push([0,1,2,3,4].map(r=>r*5+n));}lists.push([0,6,12,18,24],[4,8,12,16,20]);return lists.some(line=>line.every(i=>b[i]));}
function tap(id){if(!current||marked.has(id)||advancing)return;const person=people.find(f=>f.id===current);if(id!==current){$("status").textContent="Not quite. Reread the clue and compare the portraits.";return;}advancing=true;marked.add(id);window.BHGameFX?.sound("success");window.BHGameFX?.confetti(document.body,34);$("score").textContent=marked.size+" of 24 found";$("status").textContent="Correct — "+person.name+"! "+(profiles.get(id).significance||"");render();if(lines()&&!won){won=true;$("status").textContent="BINGO! Five in a row. Continue discovering the other figures or shuffle a new card.";window.BHGameFX?.sound("win");window.BHGameFX?.confetti(document.body,70);}setTimeout(()=>{advancing=false;next();},1150);}
function render(){const board=$("board");board.replaceChildren();card.forEach((id,i)=>{const b=document.createElement("button");b.type="button";b.className="bhg-card"+(id===null?" free":marked.has(id)?" marked":"");if(id===null){b.textContent="FREE";b.disabled=false;b.setAttribute("aria-label","FREE SPACE — already marked");b.addEventListener("click",()=>{$("status").textContent="The FREE square already counts toward your Bingo line.";});}else{const f=people.find(x=>x.id===id),img=document.createElement("img"),name=document.createElement("span");img.src="../../assets/hall-of-legends/portraits/"+f.source_artwork;img.alt="";img.loading="lazy";name.textContent=f.name;b.append(img,name);b.setAttribute("aria-label","Select "+f.name+(marked.has(id)?" (marked)":""));b.disabled=marked.has(id);b.addEventListener("click",()=>tap(id));}board.append(b);});}
function start(){marked=new Set();won=false;advancing=false;window.BHGameFX?.sound("start");pool=shuffle(people).slice(0,24).map(p=>p.id);card=[...pool.slice(0,12),null,...pool.slice(12)];$("score").textContent="0 of 24 found";$("status").textContent="Find the figure described in the clue.";render();next();}
Promise.all([fetch("../hall-of-legends/data/death-chronology.json").then(r=>r.json()),...([1,2,3].map(n=>fetch("../hall-of-legends/data/biographies-0"+n+".json").then(r=>r.json())))]).then(([d,...parts])=>{people.push(...d.scenes.flatMap(s=>s.portraits).filter(f=>/^bh-/.test(f.id)));for(const p of parts.flatMap(x=>x.entries))profiles.set(p.id,p);if(people.length!==141||profiles.size!==141)throw Error("Incomplete Hall bank");start();}).catch(()=>{$("clue").textContent="The game data could not be loaded. Please refresh this page.";});
$("restart").addEventListener("click",()=>{if(people.length)start();});
})();
</script><script src="../../assets/black-history-game-fx.js?v=20261104-a"></script><script src="../../assets/site-shell.js?v=20261108-black-history-nav-v15" data-etp-root="../../"></script></body></html>
