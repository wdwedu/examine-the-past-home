<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ancient Worlds: Time Rush — History Unlocked</title>
<link rel="stylesheet" href="/examine-the-past-home/games/assets/site-shell.css">
<link rel="stylesheet" href="/examine-the-past-home/games/time-rush/game.css">
</head>
<body data-music-source="https://wdwedu.github.io/examine-the-past-home/" data-music-volume=".22">
<div id="game-shell-nav"></div>
<audio id="gameAudio" loop preload="auto"></audio>

<main id="timeRushGame">
  <section class="game-hero">
    <p class="game-subtitle">Put history in order before time runs out.</p>

    <div class="progress-bar" id="progressBar" aria-label="Game progress"></div>

    <section class="live-timeline" aria-label="Interactive timeline">
      <div class="timeline-line"></div>
      <div class="timeline-slots" id="timelineSlots"></div>
    </section>
  </section>

  <section class="game-shell">
    <aside class="panel controls">
      <h2>Mission Control</h2>
      <p class="mission-copy">Read. Remember. Arrange. Build the timeline. Get feedback. Advance.</p>

      <div class="metrics">
        <div class="metric"><b>Round</b><span id="roundValue">1/9</span></div>
        <div class="metric"><b>Time</b><span id="timeValue">—</span></div>
        <div class="metric"><b>Score</b><span id="scoreValue">0</span></div>
        <div class="metric"><b>Game</b><span>Ancient</span></div>
      </div>

      <button class="action" id="primaryAction">Start Game</button>
      <button class="ghost" id="secondaryAction" hidden>Clear Timeline</button>

      <div class="hint-box" id="hintBox" hidden></div>
      <div class="result-box" id="resultBox" hidden></div>
    </aside>

    <section class="panel main-panel" id="mainPanel"></section>
  </section>
</main>

<div class="completion" id="completion" role="dialog" aria-modal="true" aria-label="Game complete">
  <div class="badge-card">
    <div class="badge-emblem"><span>⌛</span></div>
    <h2>Ancient Worlds Badge</h2>
    <div class="badge-rank" id="badgeRank">Ancient Worlds Chronologist</div>
    <p id="badgeScore">Timeline mastery complete.</p>
    <div class="unlock">NEXT GAME UNLOCKED<br>Time Rush: U.S. Presidents</div>
    <button class="action" id="vaultReturn" style="margin-top:18px">Return to Game Vault</button>
    <button class="ghost" id="playAgain">Play Ancient Worlds Again</button>
  </div>
</div>

<div id="game-shell-footer"></div>

<script src="/examine-the-past-home/games/assets/site-shell.js"></script>
<script src="/examine-the-past-home/games/time-rush/game.js"></script>
</body>
</html>
