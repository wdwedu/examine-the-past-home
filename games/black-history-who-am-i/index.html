<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Who Am I? | Examine the Past</title><meta name="description" content="Reveal historical portraits and guess their identities."><link rel="stylesheet" href="../../assets/black-history-games.css?v=20261104-games-v3"></head><body><main class="bhg-wrap"><a class="bhg-back" href="../black-history/">← Black History Games</a><h1>Who Am I?</h1><p class="bhg-desc">A mystery portrait. Four clues. Guess early for more points, or reveal another clue.</p><div class="bhg-stats"><span id="round">Round 1 / 10</span><span id="score">Score: 0</span><button type="button" class="bhg-action" id="restart">New Game</button></div><div id="image" class="bhg-image-stage"><img id="portrait" alt="Blurred historical portrait"></div><div id="clue" class="bhg-clue" aria-live="polite"></div><div id="answers" class="bhg-choice-grid"></div><p class="bhg-status" id="status" role="status" aria-live="polite"></p><div class="bhg-stats"><button class="bhg-action" type="button" id="hint">Reveal Another Clue</button><button class="bhg-next" type="button" id="next" hidden>Next Figure →</button></div></main><script>
(()=>{"use strict";const $=x=>document.getElementById(x),mix=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};let people=[],profiles=new Map(),rounds=[],index=0,step=0,score=0,done=false,choices=[];
function safe(s,name){const names=[name,...name.split(/[ ()".]+/).filter(x=>x.length>4)];for(const n of names){if(n)s=s.replaceAll(n,"this historical figure");}return s;}
function begin(){rounds=mix(people.filter(p=>profiles.has(p.id))).slice(0,10);index=0;score=0;show();window.BHGameFX?.sound("start");}
function show(){if(index>=rounds.length){$("clue").textContent="Game complete! Total score: "+score;$("answers").replaceChildren();$("hint").hidden=true;$("next").hidden=true;$("status").textContent="Shuffle to start a new mystery.";return;}step=0;done=false;const p=rounds[index],profile=profiles.get(p.id);choices=mix([p,...mix(people.filter(q=>q.id!==p.id&&profiles.has(q.id))).slice(0,3)]);$("round").textContent="Round "+(index+1)+" / 10";$("score").textContent="Score: "+score;$("portrait").src="../../assets/hall-of-legends/portraits/"+p.source_artwork;$("portrait").alt="Mystery historical figure";$("image").classList.remove("revealed");$("hint").hidden=false;$("next").hidden=true;$("status").textContent="";renderClue();}
function renderClue(){const p=rounds[index],profile=profiles.get(p.id),clues=["Historical influence: "+safe(profile.significance,p.name),"Historical inquiry: "+safe(profile.question,p.name),"Investigate the life: "+safe(profile.overview,p.name),"Historical period: "+(p.lifespan_or_period||"Dates uncertain")+". "+safe(profile.overview,p.name)];$("clue").textContent="Clue "+(step+1)+" of 4 · "+(400-step*100)+" points\n"+clues[step];$("portrait").style.setProperty("--blur",(17-step*5)+"px");$("hint").disabled=step>=3;$("hint").textContent=step>=3?"Final clue revealed":"Reveal Another Clue";const options=$("answers");options.replaceChildren();for(const q of choices){const btn=document.createElement("button");btn.type="button";btn.className="bhg-answer";btn.textContent=q.name;btn.disabled=done;btn.addEventListener("click",()=>guess(q.id,btn));options.append(btn);}}
function guess(id,button){if(done)return;const p=rounds[index];if(id!==p.id){button.classList.add("wrong");button.disabled=true;$("status").textContent="Not quite. Try another portrait or reveal a clue.";return;}done=true;score+=400-step*100;$("score").textContent="Score: "+score;$("status").textContent="Correct! "+p.name+" · +"+(400-step*100)+" points";$("image").classList.add("revealed");$("portrait").style.setProperty("--blur","0px");$("hint").hidden=true;$("next").hidden=false;for(const b of $("answers").children){b.disabled=true;if(b.textContent===p.name)b.classList.add("right");}window.BHGameFX?.sound("success");window.BHGameFX?.confetti();}
$("hint").addEventListener("click",()=>{if(done)return;if(step<3){step++;renderClue();}});
$("next").addEventListener("click",()=>{index++;show();});
$("restart").addEventListener("click",()=>{if(people.length)begin();});
Promise.all([fetch("../hall-of-legends/data/death-chronology.json").then(r=>r.json()),...([1,2,3].map(n=>fetch("../hall-of-legends/data/biographies-0"+n+".json").then(r=>r.json())))]).then(([data,...parts])=>{people=data.scenes.flatMap(s=>s.portraits);profiles=new Map(parts.flatMap(x=>x.entries).map(p=>[p.id,p]));if(people.length!==141||profiles.size!==141)throw Error("Incomplete historical collection");begin();}).catch(()=>{$("status").textContent="The historical collection could not be loaded. Refresh to retry.";});
})();
</script><script src="../../assets/black-history-game-fx.js?v=20261104-a"></script><script src="../../assets/site-shell.js?v=20261108-black-history-nav-v15" data-etp-root="../../"></script></body></html>
