<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Historical Connections | Examine the Past</title><meta name="description" content="Explore Historical Connections in Examine the Past&#x27;s interactive history games collection."><link rel="stylesheet" href="../../assets/black-history-games.css?v=20261104-games-v3"></head><body><main class="bhg-wrap"><a class="bhg-back" href="../../lessons/black-history/">← Black History Games</a><h1>Historical Connections</h1><p class="bhg-desc">Find two figures connected by the historical theme. Each correct pair reveals how their lives and work intersected.</p><div class="bhg-stats"><span id="score">Connections: 0 / 6</span><button id="restart" class="bhg-action" type="button">Shuffle the Portraits</button></div><div class="bhg-clue" id="clue" aria-live="polite"></div><p class="bhg-status" id="status" role="status" aria-live="polite">Select two portraits.</p><div class="bhg-match-grid" id="board" aria-label="Twelve historical figure portraits"></div><div id="connection" class="bhg-tile-message" hidden></div><div class="bhg-stats"><button id="next" class="bhg-next" type="button" hidden>Next Connection →</button></div></main><script>
(()=>{"use strict";const $=id=>document.getElementById(id);const pairs=[
{theme:"Abolition and the fight against slavery",ids:["bh-027","bh-023"],explain:"Harriet Tubman and Frederick Douglass both escaped slavery and worked for freedom. Tubman aided escape journeys; Douglass became a leading abolitionist speaker and writer."},
{theme:"Harlem Renaissance literature",ids:["bh-058","bh-047"],explain:"Langston Hughes and Zora Neale Hurston helped shape Black literary culture during the Harlem Renaissance, writing in distinct styles and genres."},
{theme:"The mid-century civil rights movement",ids:["bh-096","bh-059"],explain:"Rosa Parks's arrest helped spark the Montgomery bus boycott, in which Martin Luther King Jr. became a prominent leader."},
{theme:"NASA mathematics and space exploration",ids:["bh-109","bh-075"],explain:"Katherine Johnson and Annie Easley contributed essential mathematical and computing work to U.S. space and aerospace programs."},
{theme:"Breaking barriers in tennis",ids:["bh-093","bh-082"],explain:"Althea Gibson and Arthur Ashe challenged racial barriers in international tennis and achieved major championship success."},
{theme:"Ending apartheid in South Africa",ids:["bh-102","bh-115"],explain:"Nelson Mandela and Desmond Tutu became influential voices in the struggle against apartheid, with different roles in politics, faith, and reconciliation."}
];
let people=new Map(),order=[],round=0,found=new Set(),selected=[],blocked=false;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function start(){round=0;found=new Set();selected=[];blocked=false;order=shuffle(pairs.flatMap(p=>p.ids));$("connection").hidden=true;$("next").hidden=true;$("score").textContent="Connections: 0 / 6";render();window.BHGameFX?.sound("start");}
function render(){const current=pairs[round];$("clue").textContent=current?"Find the two people connected to: "+current.theme:"All connections discovered!";const board=$("board");board.replaceChildren();for(const id of order){const f=people.get(id),b=document.createElement("button");b.type="button";b.className="bhg-card"+(found.has(id)?" matched":"")+(selected.includes(id)?" selected":"");b.disabled=found.has(id)||!current||blocked;b.setAttribute("aria-pressed",String(selected.includes(id)));const img=document.createElement("img");img.src="../../assets/hall-of-legends/portraits/"+f.source_artwork;img.alt="";img.loading="lazy";const title=document.createElement("span");title.textContent=f.name;b.append(img,title);b.addEventListener("click",()=>choose(id));board.append(b);}}
function choose(id){if(blocked||found.has(id)||selected.includes(id))return;selected.push(id);if(selected.length<2){$("status").textContent="Choose one more portrait.";render();return;}
blocked=true;render();const correct=pairs[round].ids.every(x=>selected.includes(x));if(correct){for(const p of selected)found.add(p);$("score").textContent="Connections: "+(round+1)+" / 6";$("status").textContent="Connection found!";$("connection").textContent=pairs[round].explain;$("connection").hidden=false;window.BHGameFX?.sound("success");window.BHGameFX?.confetti(document.body,28);$("next").hidden=false;blocked=false;render();}
else{$("status").textContent="Those two don't match this theme. Look for another connection.";setTimeout(()=>{selected=[];blocked=false;render();},850);}}
$("next").addEventListener("click",()=>{round++;selected=[];$("connection").hidden=true;$("next").hidden=true;$("status").textContent=round>=6?"You found all six connections!":"Select two portraits.";if(round===6){window.BHGameFX?.sound("win");window.BHGameFX?.confetti(document.body,70);}render();});
$("restart").addEventListener("click",()=>{if(people.size)start();});
fetch("../hall-of-legends/data/death-chronology.json").then(r=>r.json()).then(d=>{people=new Map(d.scenes.flatMap(s=>s.portraits).map(f=>[f.id,f]));if(pairs.some(p=>p.ids.some(id=>!people.has(id))))throw Error("Missing portrait");start();}).catch(()=>{$("status").textContent="The collection could not be loaded. Please refresh.";});
})();
</script><script src="../../assets/black-history-game-fx.js?v=20261104-a"></script><script src="../../assets/site-shell.js" data-etp-root="../../"></script></body></html>
