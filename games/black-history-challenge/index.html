<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Play a Black History knowledge challenge with five categories."><title>Black History Challenge Board | Examine the Past</title><link rel="stylesheet" href="../../assets/black-history-games.css?v=20261104-games-v3"><script defer src="../../app-assets/install.js?v=20261108-native-menu-v17"></script></head><body><main class="bhg-wrap"><a class="bhg-back" href="../black-history/">← Black History Games</a><h1>Black History Challenge Board</h1><p class="bhg-desc">Choose any category and point value. Read the clue, pick the figure, and earn points.</p><div class="bhg-stats"><span id="score">Score: 0</span><span id="remaining">25 clues remaining</span><button class="bhg-action" type="button" id="reset">Restart Board</button></div><div class="bhg-board" id="board" aria-label="Five categories with five clues each"></div><section class="bhg-question" id="question" hidden aria-live="polite"><h2 id="question-title"></h2><div id="clue" class="bhg-clue"></div><div id="answers" class="bhg-answers"></div><div id="feedback" class="bhg-status" role="status"></div><div id="reveal" class="bhg-reveal"></div><button class="bhg-next" id="return" type="button">Return to Board</button></section></main>
<script>
(()=>{"use strict";const $=id=>document.getElementById(id);let categories=[],figures=new Map(),used=new Set(),score=0,active=null;
const make=(tag,cls,text)=>{const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el};
const mix=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;};
function stats(){$("score").textContent="Score: "+score;$("remaining").textContent=(25-used.size)+" clues remaining";}
function board(){const area=$("board");area.replaceChildren();for(const c of categories)area.append(make("div","bhg-category",c.name));for(let tier=0;tier<5;tier++){categories.forEach((c,ci)=>{const key=ci+"-"+tier,btn=make("button","bhg-cell",(tier+1)*100);btn.type="button";btn.disabled=used.has(key);btn.setAttribute("aria-label",c.name+" for "+((tier+1)*100)+" points"+(btn.disabled?", completed":""));btn.addEventListener("click",()=>open(ci,tier));area.append(btn);});}stats();}
function open(ci,tier){window.BHGameFX?.sound("start");const c=categories[ci],item=c.items[tier],key=ci+"-"+tier;if(used.has(key))return;active=key;$("question").hidden=false;$("board").hidden=true;$("question-title").textContent=c.name+" · "+((tier+1)*100)+" points";$("clue").textContent=item.clue;$("feedback").textContent="Choose the figure described in the clue.";$("reveal").replaceChildren();const all=$("answers");all.replaceChildren();let choices=mix([item.id,...mix(c.items.filter(x=>x.id!==item.id).map(x=>x.id)).slice(0,3)]);for(const id of choices){const p=figures.get(id),b=make("button","bhg-answer",p.name);b.type="button";b.addEventListener("click",()=>answer(id===item.id,item,b,key,tier));all.append(b);}$("return").textContent="Skip and Return to Board";}
function answer(right,item,chosen,key,tier){if(used.has(key))return;used.add(key);if(right){score+=(tier+1)*100;chosen.classList.add("right");window.BHGameFX?.sound("success");window.BHGameFX?.confetti(document.body,32);$("feedback").textContent="Correct! +"+((tier+1)*100)+" points.";}else{chosen.classList.add("wrong");$("feedback").textContent="Good attempt. The correct answer is "+figures.get(item.id).name+".";}for(const btn of $("answers").querySelectorAll("button")){btn.disabled=true;if(btn.textContent===figures.get(item.id).name)btn.classList.add("right");}const p=figures.get(item.id),img=make("img"),text=make("p","",p.name+": "+item.clue);img.src="../../assets/hall-of-legends/portraits/"+p.source_artwork;img.alt="Illustrated portrait of "+p.name;$("reveal").append(img,text);$("return").textContent=used.size===25?"See Final Score":"Return to Board";stats();}
function back(){if(!active)return; if(!used.has(active)){used.add(active);$("feedback").textContent="Clue skipped.";}active=null;$("question").hidden=true;$("board").hidden=false;board();if(used.size===25){$("remaining").textContent="Finished! All 25 clues played."}}
$("return").addEventListener("click",back);$("reset").addEventListener("click",()=>{used=new Set();score=0;active=null;$("question").hidden=true;$("board").hidden=false;board();});
Promise.all([fetch("./questions.json").then(r=>r.json()),fetch("../hall-of-legends/data/death-chronology.json").then(r=>r.json())]).then(([d,people])=>{categories=d.categories;figures=new Map(people.scenes.flatMap(s=>s.portraits).map(f=>[f.id,f]));if(categories.length!==5||categories.some(c=>c.items.length!==5||c.items.some(i=>!figures.has(i.id))))throw Error("Invalid question bank");board();}).catch(()=>{$("remaining").textContent="Unable to load game questions. Please refresh.";});
})();
</script><script src="../../assets/black-history-game-fx.js?v=20261104-a"></script><script src="../../assets/site-shell.js?v=20261109-footer-legal-install-v21" data-etp-root="../../"></script></body></html>
