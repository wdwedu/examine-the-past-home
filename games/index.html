<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Games — Examine the Past</title>
<style>
:root{--yellow:#fff000;--green:#8dff43;--white:#f2efe7}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:var(--white);font-family:Georgia,"Times New Roman",serif}
.site-nav{position:sticky;top:0;z-index:1000;background:rgba(0,0,0,.985);border-bottom:1px solid #3c3c3c;box-shadow:0 8px 20px rgba(0,0,0,.32)}
.nav-inner{max-width:1500px;margin:auto;min-height:91px;display:flex;align-items:center;justify-content:center;padding:22px 10px 10px}
.nav-center{display:flex;align-items:center;justify-content:center;gap:17px;flex-wrap:wrap}
.nav-item{width:74px;height:59px;display:grid;place-items:center;position:relative;color:#fff;text-decoration:none;border-radius:11px;transition:.22s}
.nav-item:hover,.nav-item:focus-visible,.nav-item.active{color:var(--yellow);background:#0b0c0a;transform:translateY(-3px);outline:none}
.nav-label{position:absolute;bottom:61px;left:50%;transform:translate(-50%,6px);opacity:0;white-space:nowrap;color:var(--green);font:700 10px Georgia,serif;transition:.2s;pointer-events:none}
.nav-item:hover .nav-label,.nav-item:focus-visible .nav-label{opacity:1;transform:translate(-50%,0)}
.emoji-icon{font-size:25px;line-height:1}
.blooms-symbol{color:#ffd800;font-size:29px;font-weight:900}
.timeline-line-icon{width:38px;height:18px;display:block}
.timeline-line-icon svg{width:38px;height:18px}
.nav-glow{height:1px;background:linear-gradient(90deg,transparent,#3e3e3e 20%,#585858 50%,#3e3e3e 80%,transparent)}
.blank-stage{min-height:calc(100vh - 92px);background:#000}
.build-badge{position:fixed;right:12px;bottom:10px;color:#686868;font:700 9px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;pointer-events:none}
@media(max-width:900px){
 .nav-inner{padding:10px 6px 8px;min-height:auto}
 .nav-center{gap:2px}
 .nav-item{width:48px;height:48px}
 .nav-label{display:none}
 .emoji-icon{font-size:21px}
}
</style>
</head>
<body>
<nav class="site-nav" aria-label="Examine the Past navigation">
  <div class="nav-inner">
    <div class="nav-center">
      <a class="nav-item" href="https://www.examinethepast.com/" aria-label="Home">
        <span class="nav-label">Home</span><span class="emoji-icon">🏠</span>
      </a>
      <a class="nav-item" href="https://www.examinethepast.com/about-us" aria-label="About">
        <span class="nav-label">About</span><span class="emoji-icon">ℹ️</span>
      </a>
      <a class="nav-item" href="https://www.examinethepast.com/explore-the-past" aria-label="History Hub">
        <span class="nav-label">History Hub</span><span class="emoji-icon">🎓</span>
      </a>
      <a class="nav-item" href="https://www.examinethepast.com/#resource-vault" aria-label="Resource Vault">
        <span class="nav-label">Resource Vault</span><span class="emoji-icon">📖</span>
      </a>
      <a class="nav-item" href="https://www.examinethepast.com/on-this-day-in-history" aria-label="On This Day">
        <span class="nav-label">On This Day</span><span class="emoji-icon">📅</span>
      </a>
      <a class="nav-item" href="https://www.examinethepast.com/historical-maps" aria-label="History Map">
        <span class="nav-label">History Map</span><span class="emoji-icon">🌍</span>
      </a>
      <a class="nav-item" href="https://www.examinethepast.com/interactive-timeline" aria-label="Timeline">
        <span class="nav-label">Timeline</span>
        <span class="timeline-line-icon" aria-hidden="true"><svg viewBox="0 0 38 18"><path d="M3 9H35" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2.2"/><circle cx="7" cy="9" fill="currentColor" r="3.1"/><circle cx="19" cy="9" fill="currentColor" r="3.1"/><circle cx="31" cy="9" fill="currentColor" r="3.1"/></svg></span>
      </a>
      <a class="nav-item" href="https://www.examinethepast.com/resources/blooms-taxonomy" aria-label="Bloom's">
        <span class="nav-label">Bloom's</span><span class="emoji-icon blooms-symbol">▲</span>
      </a>
      <a class="nav-item active" href="https://wdwedu.github.io/examine-the-past-home/games/" aria-label="Games">
        <span class="nav-label">Games</span><span class="emoji-icon">⭐</span>
      </a>
      <a class="nav-item" href="https://www.youtube.com/@ExamineThePast" aria-label="Communities">
        <span class="nav-label">Communities</span><span class="emoji-icon">👥</span>
      </a>
    </div>
  </div>
  <div class="nav-glow"></div>
</nav>
<main class="blank-stage" aria-label="Build 1 blank game workspace"></main>
<div class="build-badge">Build 1 · Navigation Test</div>
</body>
</html>
