<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Games — Examine the Past</title>
<style>
:root{--yellow:#fff000;--green:#8dff43;--white:#f2efe7}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:var(--white);font-family:Georgia,"Times New Roman",serif}

/* Mirrored from the Examine the Past home navigation */
.site-nav{
  position:sticky;top:0;z-index:1000;
  background:rgba(0,0,0,.975);
  border-bottom:1px solid #3c3c3c;
  box-shadow:0 8px 20px rgba(0,0,0,.32),0 1px 0 rgba(255,255,255,.025)
}
.final-nav .final-nav-inner{
  width:min(1900px,calc(100% - 20px));
  min-height:104px;
  margin:0 auto;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px 115px 10px;
  overflow-x:auto;
}
.final-nav .nav-center{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  margin:0 auto;
}
.nav-item{
  width:74px;height:59px;
  display:grid;place-items:center;
  position:relative;
  color:#fff;text-decoration:none;
  border:0;background:transparent;cursor:pointer;
  border-radius:11px;transition:.22s;flex:0 0 auto;
  font:inherit;padding:0;
}
.final-nav .image-nav{
  width:86px;height:64px;padding:0;border:0;background:transparent;
  display:grid;place-items:center;position:relative;
}
.final-nav .nav-label{
  position:absolute;
  bottom:67px;left:50%;
  transform:translate(-50%,6px);
  opacity:0;
  color:var(--green);
  font:700 10px Georgia,serif;
  white-space:nowrap;
  transition:.2s ease;
  pointer-events:none;
}
.final-nav .image-nav:hover .nav-label,
.final-nav .image-nav:focus-visible .nav-label{
  opacity:1;transform:translate(-50%,0)
}
.final-nav .image-nav:hover,
.final-nav .image-nav:focus-visible{
  color:var(--yellow);
  background:#0b0c0a;
  transform:translateY(-3px);
  outline:none;
}
.emoji-icon{font-size:25px;line-height:1;transition:.2s ease}
.final-nav .image-nav:hover .emoji-icon,
.final-nav .image-nav:focus-visible .emoji-icon{transform:translateY(-4px) scale(1.08)}
.blooms-symbol{color:#ffd800;font-size:29px;font-weight:900}
.timeline-line-icon{width:38px;height:18px;display:block;transition:.2s ease}
.timeline-line-icon svg{width:38px;height:18px}
.final-nav .image-nav:hover .timeline-line-icon{transform:translateY(-4px) scale(1.08)}
.nav-glow{
  height:1px;
  background:linear-gradient(90deg,transparent,#3e3e3e 20%,#585858 50%,#3e3e3e 80%,transparent);
  box-shadow:0 0 5px rgba(255,255,255,.045)
}

/* Same dropdown behavior family as home nav */
.nav-drop{position:relative;flex:0 0 auto}
.course-menu,.community-menu{
  position:absolute;top:67px;left:50%;transform:translateX(-50%) translateY(7px);
  min-width:210px;padding:10px;
  border:1px solid #353535;border-radius:10px;
  background:#101110;
  box-shadow:0 14px 30px rgba(0,0,0,.5);
  opacity:0;visibility:hidden;pointer-events:none;
  transition:.18s ease;
}
.nav-drop.open .course-menu,.nav-drop.open .community-menu{
  opacity:1;visibility:visible;pointer-events:auto;transform:translateX(-50%) translateY(0)
}
.mini-menu-head,.community-title{
  color:var(--green);font:700 10px Arial,sans-serif;letter-spacing:.12em;
  padding:4px 8px 7px;text-transform:uppercase
}
.course-menu a,.community-menu a{
  display:block;padding:8px 9px;border-radius:7px;color:#e9e7df;text-decoration:none;
  font:700 12px Georgia,serif
}
.course-menu a:hover,.community-menu a:hover{background:#1b1c19;color:var(--yellow)}
.community-links{display:grid;grid-template-columns:1fr 1fr;gap:4px}

/* Home-page sound control: speaker icon toggles off/on */
.sound-toggle-single .sound-emoji{font-size:24px}
.sound-toggle-single.sound-on{color:var(--green)}
.sound-toggle-single.loading{opacity:.55}

.blank-stage{min-height:calc(100vh - 105px);background:#000}
.build-badge{
  position:fixed;right:12px;bottom:10px;color:#686868;
  font:700 9px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;
  pointer-events:none
}

@media(max-width:1000px){
  .final-nav .final-nav-inner{padding:18px 8px 10px;justify-content:flex-start}
  .final-nav .nav-center{justify-content:flex-start;gap:4px;margin:0}
  .final-nav .image-nav{width:54px;height:58px}
  .final-nav .nav-label{bottom:61px}
}
@media(max-width:700px){
  .final-nav .final-nav-inner{min-height:91px;padding:16px 4px 8px}
  .final-nav .nav-center{gap:1px}
  .final-nav .image-nav{width:45px;height:52px}
  .emoji-icon{font-size:20px}
  .blooms-symbol{font-size:24px}
  .timeline-line-icon,.timeline-line-icon svg{width:32px}
  .final-nav .nav-label{display:none}
  .course-menu,.community-menu{position:fixed;top:88px;left:10px;right:10px;transform:none;min-width:0}
  .nav-drop.open .course-menu,.nav-drop.open .community-menu{transform:none}
}
</style>
</head>
<body>

<nav aria-label="Primary navigation" class="site-nav final-nav etp-nav-vnext">
  <div class="final-nav-inner etp-nav-row">
    <div class="nav-center">
      <a aria-label="Home" class="nav-item image-nav nav-home" href="https://www.examinethepast.com/">
        <span class="nav-label">Home</span>
        <span aria-hidden="true" class="emoji-icon home-emoji">🏠</span>
      </a>

      <a aria-label="About Examine the Past" class="nav-item image-nav nav-about"
         href="https://www.examinethepast.com/about-us">
        <span class="nav-label">About</span>
        <span aria-hidden="true" class="emoji-icon about-info-emoji">ℹ️</span>
      </a>

      <div class="nav-drop">
        <button aria-expanded="false" class="nav-item image-nav drop-toggle" type="button">
          <span class="nav-label">History Hub</span>
          <span class="emoji-icon history-emoji">🎓</span>
        </button>
        <div class="course-menu mini-labs-menu">
          <div class="mini-menu-head">Explore the Past</div>
          <a href="https://www.examinethepast.com/explore-the-past/social-studies-mini-labs/v0-start-here-social-studies">Social Studies</a>
          <a href="https://www.examinethepast.com/explore-the-past/world-history">World History</a>
        </div>
      </div>

      <a class="nav-item image-nav" href="https://www.examinethepast.com/#resource-vault">
        <span class="nav-label">Resource Vault</span>
        <span class="emoji-icon">📖</span>
      </a>

      <a class="nav-item image-nav" href="https://www.examinethepast.com/on-this-day-in-history">
        <span class="nav-label">On This Day</span>
        <span class="emoji-icon">📅</span>
      </a>

      <a class="nav-item image-nav" href="https://www.examinethepast.com/historical-maps">
        <span class="nav-label">History Map</span>
        <span class="emoji-icon">🌍</span>
      </a>

      <a class="nav-item image-nav" href="https://www.examinethepast.com/interactive-timeline">
        <span class="nav-label">Timeline</span>
        <span aria-hidden="true" class="timeline-line-icon">
          <svg viewBox="0 0 38 18">
            <path d="M3 9H35" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2.2"></path>
            <circle cx="7" cy="9" fill="currentColor" r="3.1"></circle>
            <circle cx="19" cy="9" fill="currentColor" r="3.1"></circle>
            <circle cx="31" cy="9" fill="currentColor" r="3.1"></circle>
          </svg>
        </span>

      <a class="nav-item image-nav" href="https://www.examinethepast.com/resources/blooms-taxonomy">

        <span class="emoji-icon blooms-symbol">▲</span>
      </a>

      <a class="nav-item image-nav" href="https://wdwedu.github.io/examine-the-past-home/games/">
        <span class="nav-label">Games</span>
        <span aria-hidden="true" class="emoji-icon">🎮</span>
      </a>

      <div class="nav-drop">
        <button aria-expanded="false" class="nav-item image-nav drop-toggle" type="button">
          <span class="nav-label">Communities</span>
          <span class="emoji-icon community-emoji">👥</span>
        </button>
        <div class="community-menu">
          <div class="community-title">Join Our Communities</div>
          <div class="community-links">
            <a href="https://www.youtube.com/@ExamineThePast">YouTube</a>
            <a href="https://www.facebook.com/examinethepast">Facebook</a>
            <a href="https://www.instagram.com/examinethepast/">Instagram</a>
            <a href="https://www.pinterest.com/examinethepast/">Pinterest</a>
            <a href="https://www.teacherspayteachers.com/store/examine-the-past">TPT</a>
            <a href="https://www.etsy.com/shop/examinethepast">Etsy</a>
            <a href="https://www.redbubble.com/people/examinethepast/shop">Redbubble</a>
            <a href="https://x.com/">X</a>
          </div>
        </div>
      </div>

      <a class="nav-item image-nav" href="https://www.examinethepast.com/#contact-section">
        <span class="nav-label">Contact Us</span>
        <span class="emoji-icon">📧</span>
      </a>

      <button aria-label="Turn background sound on"
              class="nav-item image-nav sound-toggle-single"
              id="soundToggle" type="button">
        <span class="nav-label" id="soundStatus">Sound Off</span>
        <span class="emoji-icon sound-emoji" id="soundIcon">🔇</span>
      </button>
    </div>
  </div>
  <div class="nav-glow"></div>
</nav>

<audio id="gameAudio" loop preload="none"></audio>
<main class="blank-stage" aria-label="Build 3 blank game workspace"></main>
<div class="build-badge">Build 3 · Home Navigation Match</div>

<script>
(() => {
  document.querySelectorAll('.nav-drop > .drop-toggle').forEach(toggle => {
    toggle.addEventListener('click', e => {
      e.stopPropagation();
      const drop = toggle.parentElement;
      document.querySelectorAll('.nav-drop').forEach(d => {
        if (d !== drop) {
          d.classList.remove('open');
          const b = d.querySelector('.drop-toggle');
          if (b) b.setAttribute('aria-expanded','false');
        }
      });
      const open = drop.classList.toggle('open');
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  });
  document.addEventListener('click', () => {
    document.querySelectorAll('.nav-drop').forEach(d => {
      d.classList.remove('open');
      const b = d.querySelector('.drop-toggle');
      if (b) b.setAttribute('aria-expanded','false');
    });
  });

  const button = document.getElementById('soundToggle');
  const status = document.getElementById('soundStatus');
  const icon = document.getElementById('soundIcon');
  const audio = document.getElementById('gameAudio');

  /* Keep the Games-page track from Build 2; only the control now mirrors Home. */
  const SOURCE_PAGE = 'https://wdwedu.github.io/blooms-taxonomy/';
  let loaded = false;
  audio.volume = 0.34;

  async function ensureTrack(){
    if (loaded && audio.src) return true;
    button.classList.add('loading');
    try{
      const response = await fetch(SOURCE_PAGE, {cache:'force-cache'});
      if(!response.ok) throw new Error('Soundtrack source unavailable');
      const sourceHtml = await response.text();
      const match = sourceHtml.match(/data:audio\/mpeg;base64,[^"']+/);
      if(!match) throw new Error('Embedded soundtrack not found');
      audio.src = match[0];
      loaded = true;
      return true;
    } finally {
      button.classList.remove('loading');
    }
  }

  function syncSoundUI(){
    const on = !audio.paused;
    button.classList.toggle('sound-on', on);
    status.textContent = on ? 'Sound On' : 'Sound Off';
    icon.textContent = on ? '🔊' : '🔇';
    button.setAttribute('aria-label', on ? 'Turn background sound off' : 'Turn background sound on');
  }

  button.addEventListener('click', async () => {
    try{
      if(!audio.paused){
        audio.pause();
      }else{
        const ready = await ensureTrack();
        if(ready) await audio.play();
      }
    }catch(e){
      console.error(e);
    }
    syncSoundUI();
  });

  audio.addEventListener('play', syncSoundUI);
  audio.addEventListener('pause', syncSoundUI);
  syncSoundUI();
})();
</script>
</body>
</html>
