<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Ancient Worlds Time Rush game background">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#261006"/>
    <stop offset=".22" stop-color="#0d0b08"/>
    <stop offset=".5" stop-color="#020507"/>
    <stop offset=".78" stop-color="#07101a"/>
    <stop offset="1" stop-color="#062018"/>
  </linearGradient>
  <radialGradient id="warm"><stop stop-color="#d47a12" stop-opacity=".58"/><stop offset="1" stop-color="#d47a12" stop-opacity="0"/></radialGradient>
  <radialGradient id="cool"><stop stop-color="#1d6f9e" stop-opacity=".38"/><stop offset="1" stop-color="#1d6f9e" stop-opacity="0"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff0a2"/><stop offset=".38" stop-color="#e9b23a"/><stop offset="1" stop-color="#8d4d09"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<ellipse cx="230" cy="280" rx="360" ry="330" fill="url(#warm)"/>
<ellipse cx="1380" cy="260" rx="360" ry="330" fill="url(#cool)"/>
<ellipse cx="800" cy="560" rx="520" ry="330" fill="#000" opacity=".38"/>
<!-- clock arcs -->
<g fill="none" stroke="#b97618" opacity=".25">
 <circle cx="800" cy="135" r="275" stroke-width="3"/>
 <circle cx="800" cy="135" r="235" stroke-width="1.5"/>
 <path d="M525 135h550M800-140v550" stroke-width="1"/>
</g>
<!-- left ancient silhouettes -->
<g fill="#090806" stroke="#8b4c12" stroke-opacity=".4">
 <path d="M0 610L170 425l155 185z"/>
 <path d="M120 610L300 360l180 250z" opacity=".7"/>
 <path d="M0 300h250v24H0zM20 120h210v28H20z"/>
 <path d="M34 148h18v152H34zm42 0h18v152H76zm42 0h18v152h-18zm42 0h18v152h-18zm42 0h18v152h-18z"/>
 <path d="M8 120L125 64l117 56z"/>
</g>
<!-- right historical silhouettes -->
<g fill="#061019" stroke="#285e78" stroke-opacity=".45">
 <path d="M1230 600v-260h45v-70l28-40 28 40v70h50v-100l30-44 30 44v100h70v260z"/>
 <path d="M1370 600v-185c0-70 110-70 110 0v185z"/>
 <path d="M1410 290c0-95 120-95 120 0z"/>
 <rect x="1500" y="170" width="34" height="430"/><path d="M1517 110l24 60h-48z"/>
</g>
<!-- faint world lines -->
<g fill="none" stroke="#335a6b" stroke-opacity=".18" stroke-width="1">
 <path d="M1040 360c160-140 340-95 480 20M1020 410c180-110 340-55 500 65M235 370c120-115 260-110 370-30"/>
</g>
<!-- ornate baseline -->
<path d="M120 775h1360" stroke="#b57a23" stroke-opacity=".3"/>
<path d="M300 815h1000" stroke="#5c4020" stroke-opacity=".35"/>
<!-- hourglass -->
<g transform="translate(748 24)" stroke="url(#gold)" stroke-width="5" fill="none" filter="url(#glow)">
 <path d="M0 0h104M0 90h104M18 0c0 31 13 38 34 45-21 7-34 15-34 45M86 0c0 31-13 38-34 45 21 7 34 15 34 45"/>
 <path d="M34 22h36l-18 22zM34 68h36L52 46z" fill="#e7a72e" stroke="none" opacity=".9"/>
</g>
<!-- title -->
<text x="800" y="165" text-anchor="middle" fill="url(#gold)" font-family="Georgia,serif" font-size="92" font-weight="700" letter-spacing="8" filter="url(#glow)">TIME RUSH</text>
<text x="800" y="228" text-anchor="middle" fill="#f2dfab" font-family="Georgia,serif" font-size="38" font-weight="700" letter-spacing="11">ANCIENT WORLDS</text>
<path d="M470 252h660" stroke="#b57a23" stroke-width="2" opacity=".6"/>
<!-- subtle center vignette reserved for live game -->
<rect x="330" y="290" width="940" height="445" rx="30" fill="#020507" opacity=".4"/>
</svg>